# config/symlinks.conf
# Formato: origen:destino (rutas relativas a dotfiles/ y HOME respectivamente)

# Shell
shell/.zshrc:.zshrc
shell/.bashrc:.bashrc
shell/zshrc.d/:.zshrc.d/
shell/.terminal-env:.terminal-env
shell/.profile:.profile
shell/aliases/:.aliases/
shell/.env.local:.env.local

# Git
git/.gitconfig:.gitconfig
git/.gitignore_global:.gitignore_global
git/gitConfig/:.gitConfig/

# AWS
aws/config:.aws/config

# SSH
ssh/config:.ssh/config
ssh/config.local:.ssh/config.local

# Editors
editors/.vimrc:.vimrc
editors/.editorconfig:.editorconfig

# Tools
tools/.tmux.conf:.tmux.conf
tools/.inputrc:.inputrc
