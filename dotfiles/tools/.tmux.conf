# Set prefix to Ctrl-a
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Keep tmux aligned with modern terminal capabilities.
# - default-terminal advertises the correct terminfo entry inside tmux.
# - terminal-overrides enables RGB/TrueColor for editors and color tools.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce Esc latency for modal editors and key chords.
set -sg escape-time 0

# Mouse support
set -g mouse on

# Let focus-aware applications such as Neovim detect when the terminal gains
# or loses focus over SSH.
set -g focus-events on

# Keep long-lived SSH/tmux sessions usable when reviewing logs or buffers.
set -g history-limit 50000

# Preserve clipboard integration when tmux can talk to the local terminal.
set -g set-clipboard on

# Window numbering from 1
set -g base-index 1

# Status bar
set -g status-bg black
set -g status-fg white
