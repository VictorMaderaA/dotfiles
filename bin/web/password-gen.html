<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f0f0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 0.5rem; margin: 1rem 0; font-size: 1.2rem; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.5rem 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Generador de Contraseñas</h2>
        <input type="text" id="password" readonly>
        <button onclick="generate()">Generar</button>
        <button onclick="copy()">Copiar</button>
    </div>
    <script>
        function generate() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
            let pass = "";
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('password').value = pass;
        }
        function copy() {
            const input = document.getElementById('password');
            input.select();
            document.execCommand('copy');
            alert('Copiado!');
        }
        generate();
    </script>
</body>
</html>
