<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD → PDF</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="print.css" media="print">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js" defer></script>
</head>
<body>
  <header>
    <h1>MD <span>→ PDF</span></h1>
    <div class="toolbar">
      <select id="brand" aria-label="Marca">
        <option value="none">Sin marca</option>
        <option value="narobial">Narobial</option>
        <option value="intable">InTable</option>
      </select>
      <select id="preset" aria-label="Preset de documento">
        <option value="technical">Documento técnico</option>
        <option value="report">Informe / Report</option>
        <option value="notes">Notas / Apuntes</option>
        <option value="article">Artículo / Blog</option>
        <option value="presentation">Presentación impresa</option>
      </select>
      <button id="btnSavePreset" type="button" title="Guardar preset actual">💾</button>
      <select id="template" aria-label="Template">
        <option value="">📝 Template...</option>
        <option value="cv">CV / Currículum</option>
        <option value="acta">Acta de reunión</option>
        <option value="propuesta">Propuesta técnica</option>
      </select>
      <select id="previewTheme" aria-label="Tema preview">
        <option value="light">☀ Claro</option>
        <option value="dark">🌙 Oscuro</option>
        <option value="sepia">📜 Sepia</option>
      </select>
      <button id="btnConfig" type="button" aria-expanded="false" aria-controls="configPanel">⚙ Config</button>
      <button id="btnExport" type="button">📄 Exportar PDF</button>
    </div>
  </header>

  <div id="configPanel" class="config-panel hidden" role="region" aria-label="Configuración de documento">
    <div class="config-group">
      <label for="pageSize">Página</label>
      <select id="pageSize">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="Legal">Legal</option>
      </select>
    </div>
    <div class="config-group">
      <label for="orientation">Orientación</label>
      <select id="orientation">
        <option value="portrait">Vertical</option>
        <option value="landscape">Horizontal</option>
      </select>
    </div>
    <div class="config-group">
      <label for="margins">Márgenes</label>
      <select id="margins">
        <option value="normal">Normal (2.5cm)</option>
        <option value="narrow">Estrecho (1.5cm)</option>
        <option value="wide">Ancho (3cm)</option>
      </select>
    </div>
    <div class="config-group">
      <label for="fontFamily">Fuente</label>
      <select id="fontFamily">
        <option value="system-ui, sans-serif">Sans-serif</option>
        <option value="Georgia, serif">Serif</option>
        <option value="'Courier New', monospace">Monospace</option>
      </select>
    </div>
    <div class="config-group">
      <label for="fontSize">Tamaño base</label>
      <select id="fontSize">
        <option value="11px">11px</option>
        <option value="12px" selected>12px</option>
        <option value="13px">13px</option>
        <option value="14px">14px</option>
      </select>
    </div>
    <div class="config-group">
      <label for="pageNumbers">Nº página</label>
      <input type="checkbox" id="pageNumbers" checked>
    </div>
    <div class="config-group">
      <label for="coverPage">Portada</label>
      <input type="checkbox" id="coverPage">
    </div>
    <div class="config-group">
      <label for="breakOnH1">Salto en H1</label>
      <input type="checkbox" id="breakOnH1">
    </div>
    <div class="config-group">
      <label for="autoTOC">TOC auto</label>
      <input type="checkbox" id="autoTOC">
    </div>
    <div class="config-group">
      <label for="watermark">Watermark</label>
      <input type="text" id="watermark" placeholder="Ej: BORRADOR" class="config-input">
    </div>
    <div class="config-group">
      <label for="headerText">Header</label>
      <input type="text" id="headerText" placeholder="Texto header" class="config-input">
    </div>
    <div class="config-group">
      <label for="bwMode">B&W</label>
      <input type="checkbox" id="bwMode">
    </div>
  </div>

  <main class="editor-layout">
    <div class="mobile-tabs">
      <button class="tab active" data-pane="editor">✏️ Editor</button>
      <button class="tab" data-pane="preview">👁 Preview</button>
    </div>
    <section class="editor-pane mobile-visible" aria-label="Editor Markdown">
      <div class="pane-header">
        <span>Markdown</span>
        <span id="wordCount" class="word-count"></span>
        <label class="drop-label" for="fileInput">📂 Abrir .md</label>
        <input type="file" id="fileInput" accept=".md,.markdown,.txt">
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Escribe o pega tu Markdown aquí..." aria-label="Editor de Markdown"></textarea>
    </section>
    <section class="preview-pane mobile-visible" aria-label="Preview">
      <div class="pane-header">
        <span>Preview</span>
        <span class="render-dot" id="renderDot" title="Estado del render"></span>
      </div>
      <div id="preview" class="preview-content" aria-live="polite" aria-atomic="false"></div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  <div id="srAnnouncer" role="status" aria-live="assertive" class="sr-only"></div>

  <script src="logos.js"></script>
  <script src="main.js"></script>
</body>
</html>
